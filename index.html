<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <title>HR Barcode Scanner + Revolut QR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PDF417 scanner -->
  <script src="https://cdn.jsdelivr.net/npm/pdf417-decoder@1.0.3/pdf417.min.js"></script>

  <!-- QR generator -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      padding: 1rem;
    }
    video, canvas {
      max-width: 100%;
      border-radius: 8px;
    }
    .box {
      background: white;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .muted {
      color: #666;
      font-size: 0.9rem;
    }
    #qr canvas {
      margin-top: 1rem;
    }
  </style>
</head>

<body>

<h1>HR Barcode Scanner</h1>

<div class="box">
  <video id="video" autoplay playsinline></video>
</div>

<div class="box">
  <h2>Scan result</h2>
  <pre id="result">—</pre>
</div>

<div class="box">
  <h2>Revolut / SEPA QR</h2>
  <div id="qr"></div>
  <div class="muted">
    Skeniraj u Revolutu → Payments → QR
  </div>
</div>

<script>
const video = document.getElementById("video");
const resultEl = document.getElementById("result");
const qrEl = document.getElementById("qr");

navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
  .then(stream => video.srcObject = stream);

const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");

setInterval(scanFrame, 800);

function scanFrame() {
  if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);

  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const decoded = PDF417.decode(imageData);

  if (!decoded || !decoded.length) return;

  const text = decoded[0].data.join("");
  resultEl.textContent = text;

  const data = parseHub3(text);
  if (data && data.iban && data.name) {
    const epc = buildEpcQr(data);
    renderQr(epc);
  }
}

function parseHub3(text) {
  const lines = text.split("\n");

  return {
    name: lines[5] || "",
    iban: lines[7] || "",
    amount: extractAmount(lines),
    reference: lines[13] || ""
  };
}

function extractAmount(lines) {
  for (const l of lines) {
    if (l.startsWith("HRK") || l.startsWith("EUR")) {
      return l.replace(/[^\d.,]/g, "").replace(",", ".");
    }
  }
  return "";
}

function buildEpcQr({ name, iban, amount, reference }) {
  return [
    "BCD",
    "001",
    "1",
    "SCT",
    "",
    name,
    iban,
    amount ? `EUR${amount}` : "",
    "",
    reference,
    ""
  ].join("\n");
}

function renderQr(text) {
  qrEl.innerHTML = "";
  QRCode.toCanvas(text, { errorCorrectionLevel: "M" }, (err, canvas) => {
    if (!err) qrEl.appendChild(canvas);
  });
}
</script>

</body>
</html>
