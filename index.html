<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice Scanner</title>
  <link rel="stylesheet" href="styles.css">

  <!-- QR generator -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
  <main class="wrapper">
    <!-- Scanning Page -->
    <section class="container" id="scanning-page">
      <h1 class="title">Scan Croatian Invoice Barcode</h1>
      <p>Position the barcode in front of the camera</p>
      <video id="video" width="300" height="200"></video>
    </section>

    <!-- Results Page -->
    <section class="container" id="results-page">
      <h1 class="title">Scan Result</h1>
      <div id="result-fields"></div>

      <!-- ✅ QR CODE SECTION -->
      <h2 style="margin-top:2rem;">Revolut / SEPA QR</h2>
      <div id="qr"></div>
      <p style="font-size:0.9rem; opacity:0.7;">
        Scan in Revolut → Payments → QR
      </p>

      <button class="button-large" id="copyAllButton">Copy All</button>
      <a class="button-large" id="scanAgainButton">Scan Another</a>
    </section>

    <footer class="footer">
      <section class="container">
        <p>Always double check the data before using it.</p>
      </section>
    </footer>
  </main>

  <div popover id="copied-popover">Copied to clipboard</div>

  <script src="https://unpkg.com/@zxing/library@0.21.3"></script>
  <script>
    let codeReader;
    let selectedDeviceId;
    let isScanning = false;

    function showScanningPage() {
      document.getElementById('scanning-page').style.display = 'block';
      document.getElementById('results-page').style.display = 'none';
    }

    function labelForLine(index) {
      switch (index) {
        case 2: return 'Amount';
        case 6: return 'Recipient';
        case 7: return 'Recipient\'s Address (Street and number)';
        case 8: return 'Recipient\'s Address (City and postal code)';
        case 9: return 'Recipient\'s IBAN';
        case 11: return 'Reference';
        default: return null;
      }
    }

    function formatAmount(amountString) {
      if (amountString.length !== 15) return amountString;
      const cents = parseInt(amountString, 10);
      if (isNaN(cents)) return amountString;
      const euros = cents / 100.0;
      return {
        display: euros.toLocaleString('hr-HR', { style: 'currency', currency: 'EUR' }),
        copy: euros.toFixed(2)
      };
    }

    function fixEncoding(text) {
      const map = {
        'ÄŒ': 'Č','Ä': 'č','Ä†': 'Ć','Ä‡': 'ć',
        'Ä': 'Đ','Ä‘': 'đ','Å ': 'Š','Å¡': 'š',
        'Å½': 'Ž','Å¾': 'ž',
      };
      return text.replace(new RegExp(Object.keys(map).join('|'), 'g'), m => map[m]).toUpperCase();
    }

    function buildEpcQr({ name, iban, amount, reference }) {
      return [
        "BCD",
        "001",
        "1",
        "SCT",
        "",
        name,
        iban,
        amount ? `EUR${amount}` : "",
        "",
        reference || "",
        ""
      ].join("\n");
    }

    function renderQr(epcText) {
      const qr = document.getElementById('qr');
      qr.innerHTML = "";
      QRCode.toCanvas(epcText, { errorCorrectionLevel: "M" }, (err, canvas) => {
        if (!err) qr.appendChild(canvas);
      });
    }

    function showResultsPage(resultText) {
      document.getElementById('scanning-page').style.display = 'none';
      document.getElementById('results-page').style.display = 'block';

      const lines = resultText.split('\n');
      const resultFields = document.getElementById('result-fields');
      resultFields.innerHTML = '';

      let data = {};

      for (let i = 0; i < lines.length; i++) {
        const label = labelForLine(i);
        if (!label) continue;

        let value = lines[i];
        if (label === 'Amount') {
          const amt = formatAmount(value);
          data.amount = amt.copy;
          value = amt.display;
        }
        if (label === 'Recipient') data.name = value;
        if (label === 'Recipient\'s IBAN') data.iban = value;
        if (label === 'Reference') data.reference = value;

        const field = document.createElement('div');
        field.className = 'result-field';
        field.innerHTML = `<label>${label}</label><div>${value}</div>`;
        resultFields.appendChild(field);
      }

      if (data.name && data.iban) {
        renderQr(buildEpcQr(data));
      }
    }

    function startScanning() {
      if (isScanning) return;
      isScanning = true;
      showScanningPage();
      codeReader.decodeFromInputVideoDeviceContinuously(selectedDeviceId, 'video', (result) => {
        if (result) {
          codeReader.reset();
          isScanning = false;
          showResultsPage(fixEncoding(result.text));
        }
      });
    }

    window.addEventListener('load', () => {
      codeReader = new ZXing.BrowserPDF417Reader();
      codeReader.getVideoInputDevices().then(devices => {
        selectedDeviceId = devices[0].deviceId;
        startScanning();
        document.getElementById('scanAgainButton').onclick = startScanning;
      });
    });
  </script>
</body>
</html>
