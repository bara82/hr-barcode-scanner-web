<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice Scanner</title>

  <link rel="stylesheet" href="styles.css">

  <!-- OFFLINE QR library -->
  <script src="assets/qrcode.min.js"></script>

  <!-- ZXing PDF417 -->
  <script src="https://unpkg.com/@zxing/library@0.21.3"></script>
  <!-- Apple Icon -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Invoice Scanner">
</head>

<body>
<main class="wrapper">

  <!-- SCANNING PAGE -->
  <section class="container" id="scanning-page">
    <h1 class="title">Scan Croatian Invoice Barcode</h1>

    <div style="display:flex; gap:1rem; justify-content:center; margin-bottom:1rem;">
      <button class="button-large" id="cameraScanBtn">📷 Scan with camera</button>
      <button class="button-large" id="imageScanBtn">🖼 Upload image</button>
    </div>

    <p>Position the barcode in front of the camera</p>
    <video id="video" width="300" height="200" style="display:none;"></video>

    <input type="file" id="imageInput" accept="image/*" style="display:none">
  </section>

  <!-- RESULTS PAGE -->
  <section class="container" id="results-page" style="display:none;">
    <h1 class="title">Scan Result</h1>
    <div id="result-fields"></div>

    <h2 class="title" style="margin-top:2rem;">Revolut / SEPA QR</h2>
    <div id="qr"></div>
    <p style="font-size:0.9rem; opacity:0.7;">Scan in Revolut → Payments → QR</p>

    <button class="button-large" id="copyAllButton">Copy All</button>
    <button class="button-large" id="scanAgainButton">Scan Another</button>
  </section>

  <footer class="footer">
    <section class="container">
      <p>Always double check the data before using it.</p>
    </section>
  </footer>

</main>

<div popover id="copied-popover">Copied to clipboard</div>

<script>
let codeReader;
let selectedDeviceId;
let isScanning = false;

/* ---------- UI ---------- */
function showScanningPage() {
  document.getElementById('scanning-page').style.display = 'block';
  document.getElementById('results-page').style.display = 'none';
}

/* ---------- HUB LABELS ---------- */
function labelForLine(index) {
  switch (index) {
    case 2: return 'Amount';
    case 6: return 'Recipient';
    case 7: return 'Recipient\'s Address (Street and number)';
    case 8: return 'Recipient\'s Address (City and postal code)';
    case 9: return 'Recipient\'s IBAN';
    case 10: return 'Payment Model';
    case 11: return 'Reference';
    default: return null;
  }
}

/* ---------- FORMAT ---------- */
function formatAmount(amountString) {
  if (amountString.length !== 15) return amountString;
  const cents = parseInt(amountString, 10);
  if (isNaN(cents)) return amountString;

  const euros = cents / 100.0;
  return {
    display: euros.toLocaleString('hr-HR', {
      style: 'currency',
      currency: 'EUR',
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }),
    copy: euros.toFixed(2)
  };
}

/* ---------- COPY ---------- */
let copyPopoverTimeout;
function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    clearTimeout(copyPopoverTimeout);
    const popover = document.getElementById('copied-popover');
    popover.showPopover();
    copyPopoverTimeout = setTimeout(() => popover.hidePopover(), 1500);
  });
}

/* ---------- ENCODING FIX ---------- */
function fixEncoding(text) {
  const map = {
    'ÄŒ':'Č','Ä':'č','Ä†':'Ć','Ä‡':'ć',
    'Ä':'Đ','Ä‘':'đ','Å ':'Š','Å¡':'š',
    'Å½':'Ž','Å¾':'ž'
  };
  const regex = new RegExp(Object.keys(map).join('|'), 'g');
  return text.replace(regex, m => map[m]).toUpperCase();
}

/* ---------- EPC QR ---------- */
function buildEpcPayload({ name, iban, amount, reference }) {
  const lines = [
    "BCD","001","1","SCT","",
    name || "",
    iban || "",
    amount ? `EUR${amount}` : "",
    "",
    reference || "",
    ""
  ];
  return lines.join("\n");
}

function renderQr(epcText) {
  const host = document.getElementById('qr');
  host.innerHTML = "";

  if (window.QRCode && typeof window.QRCode.toCanvas === "function") {
    const canvas = document.createElement("canvas");
    host.appendChild(canvas);
    window.QRCode.toCanvas(canvas, epcText, {
      errorCorrectionLevel: "M",
      width: 300
    });
    return;
  }

  if (window.QRCode && typeof window.QRCode === "function") {
    new window.QRCode(host, {
      text: epcText,
      width: 300,
      height: 300,
      correctLevel: window.QRCode.CorrectLevel?.M
    });
    return;
  }

  host.innerHTML = "<p style='color:red'>QR library not loaded</p>";
}

/* ---------- RESULTS ---------- */
function showResultsPage(resultText) {
  document.getElementById('scanning-page').style.display = 'none';
  document.getElementById('results-page').style.display = 'block';

  const rawDataLines = resultText.split('\n');
  const resultFields = document.getElementById('result-fields');
  resultFields.innerHTML = '';

  let visibleDataLines = [];
  let qrData = {};

  const paymentModel = rawDataLines[10] || "";
  const paymentReference = rawDataLines[11] || "";
  const fullReference =
    paymentModel && paymentReference
      ? `${paymentModel} ${paymentReference}`
      : paymentReference;

  for (let index = 0; index < rawDataLines.length; index++) {
    const label = labelForLine(index);
    if (!label) continue;

    const line = rawDataLines[index];
    const amountValue = label === 'Amount' ? formatAmount(line) : null;

    const displayValue =
      label === 'Reference'
        ? fullReference
        : amountValue ? amountValue.display : line;

    const copyValue =
      label === 'Reference'
        ? fullReference
        : amountValue ? amountValue.copy : line;

    visibleDataLines.push(copyValue);

    if (label === 'Amount' && amountValue) qrData.amount = amountValue.copy;
    if (label === 'Recipient') qrData.name = line;
    if (label === 'Recipient\'s IBAN') qrData.iban = line;
    if (label === 'Reference') qrData.reference = fullReference;

    const fieldContainer = document.createElement('div');
    fieldContainer.className = 'result-field';
    fieldContainer.dataset.copyValue = copyValue;

    fieldContainer.innerHTML = `
      <label class="result-label">${label}</label>
      <div class="result-value">${displayValue}</div>
    `;

    fieldContainer.onclick = () => copyToClipboard(copyValue);
    resultFields.appendChild(fieldContainer);
  }

  resultFields.dataset.visibleData = visibleDataLines.join('\n');

  if (qrData.name && qrData.iban) {
    renderQr(buildEpcPayload(qrData));
  }
}

/* ---------- SCAN ---------- */
function startScanning() {
  if (isScanning) return;
  isScanning = true;
  showScanningPage();
  document.getElementById('video').style.display = 'block';

  codeReader.decodeFromInputVideoDeviceContinuously(
    selectedDeviceId,
    'video',
    (result) => {
      if (result) {
        codeReader.reset();
        isScanning = false;
        showResultsPage(fixEncoding(result.text));
      }
    }
  );
}

function scanFromImageFile(file) {
  const img = document.createElement('img');
  const reader = new FileReader();

  reader.onload = () => {
    img.src = reader.result;
    codeReader.decodeFromImageElement(img)
      .then(result => showResultsPage(fixEncoding(result.text)))
      .catch(() => alert('Barcode not detected in image'));
  };

  reader.readAsDataURL(file);
}

/* ---------- INIT ---------- */
window.addEventListener('load', () => {
  codeReader = new ZXing.BrowserPDF417Reader();

  codeReader.getVideoInputDevices().then(devices => {
    selectedDeviceId = devices[0]?.deviceId;
  });

  document.getElementById('cameraScanBtn').onclick = startScanning;
  document.getElementById('imageScanBtn').onclick =
    () => document.getElementById('imageInput').click();

  document.getElementById('imageInput').onchange = e => {
    if (e.target.files[0]) {
      codeReader.reset();
      scanFromImageFile(e.target.files[0]);
    }
  };

  document.getElementById('scanAgainButton').onclick = startScanning;
  document.getElementById('copyAllButton').onclick = () => {
    const data = document.getElementById('result-fields').dataset.visibleData;
    if (data) copyToClipboard(data);
  };
});
</script>
</body>
</html>
