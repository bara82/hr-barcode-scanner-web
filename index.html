<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice Scanner</title>

  <link rel="stylesheet" href="styles.css">

  <!-- OFFLINE QR library -->
  <script src="assets/qrcode.min.js"></script>

  <!-- ZXing PDF417 -->
  <script src="https://unpkg.com/@zxing/library@0.21.3"></script>
</head>

<body>
<main class="wrapper">

  <!-- SCANNING PAGE -->
  <section class="container" id="scanning-page">
    <h1 class="title">Scan Croatian Invoice Barcode</h1>

    <div style="display:flex; gap:1rem; justify-content:center; margin-bottom:1rem;">
      <button class="button-large" id="cameraScanBtn">📷 Scan with camera</button>
      <button class="button-large" id="imageScanBtn">🖼 Upload image</button>
    </div>

    <video id="video" width="300" height="200" style="display:none;"></video>
    <input type="file" id="imageInput" accept="image/*" style="display:none">
  </section>

  <!-- RESULTS PAGE -->
  <section class="container" id="results-page" style="display:none;">
    <h1 class="title">Scan Result</h1>
    <div id="result-fields"></div>

    <h2 class="title" style="margin-top:2rem;">Revolut / SEPA QR</h2>
    <div id="qr"></div>
    <p style="font-size:0.9rem; opacity:0.7;">Scan in Revolut → Payments → QR</p>

    <button class="button-large" id="copyAllButton">Copy All</button>
    <button class="button-large" id="scanAgainButton">Scan Another</button>
  </section>

  <footer class="footer">
    <section class="container">
      <p>Always double check the data before using it.</p>
    </section>
  </footer>

</main>

<div popover id="copied-popover">Copied to clipboard</div>

<script>
let codeReader;
let selectedDeviceId;
let isScanning = false;

/* ---------- UI ---------- */
function showScanningPage() {
  document.getElementById('scanning-page').style.display = 'block';
  document.getElementById('results-page').style.display = 'none';
}

function showResultsPage(text) {
  document.getElementById('scanning-page').style.display = 'none';
  document.getElementById('results-page').style.display = 'block';

  const lines = text.split('\n');
  const fields = document.getElementById('result-fields');
  fields.innerHTML = '';

  let copyLines = [];
  let qrData = {};

  for (let i = 0; i < lines.length; i++) {
    const label = labelForLine(i);
    if (!label) continue;

    let value = lines[i];
    let copyValue = value;

    if (label === 'Amount') {
      const formatted = formatAmount(value);
      value = formatted.display;
      copyValue = formatted.copy;
      qrData.amount = formatted.copy;
    }

    if (label === 'Recipient') qrData.name = value;
    if (label === "Recipient's IBAN") qrData.iban = value;
    if (label === 'Reference') qrData.reference = value;

    copyLines.push(copyValue);

    const div = document.createElement('div');
    div.className = 'result-field';
    div.dataset.copyValue = copyValue;

    div.innerHTML = `
      <label class="result-label">${label}</label>
      <div class="result-value">${value}</div>
    `;

    div.onclick = () => copyToClipboard(copyValue);
    fields.appendChild(div);
  }

  fields.dataset.visibleData = copyLines.join('\n');

  if (qrData.name && qrData.iban) {
    renderQr(buildEpcPayload(qrData));
  }
}

/* ---------- BARCODE ---------- */
function startCameraScan() {
  if (isScanning) return;
  isScanning = true;

  document.getElementById('video').style.display = 'block';
  showScanningPage();

  codeReader.decodeFromInputVideoDeviceContinuously(
    selectedDeviceId,
    'video',
    (result) => {
      if (result) {
        codeReader.reset();
        isScanning = false;
        showResultsPage(fixEncoding(result.text));
      }
    }
  );
}

function scanFromImage(file) {
  const img = document.createElement('img');
  const reader = new FileReader();

  reader.onload = () => {
    img.src = reader.result;
    codeReader.decodeFromImageElement(img)
      .then(res => showResultsPage(fixEncoding(res.text)))
      .catch(() => alert('Barcode not found in image'));
  };

  reader.readAsDataURL(file);
}

/* ---------- HELPERS ---------- */
function labelForLine(i) {
  return {
    2: 'Amount',
    6: 'Recipient',
    7: "Recipient's Address",
    8: "Recipient's City",
    9: "Recipient's IBAN",
    11: 'Reference'
  }[i];
}

function formatAmount(s) {
  const cents = parseInt(s, 10) / 100;
  return {
    display: cents.toLocaleString('hr-HR', { style: 'currency', currency: 'EUR' }),
    copy: cents.toFixed(2)
  };
}

function fixEncoding(t) {
  const map = {
    'ÄŒ':'Č','Ä':'č','Ä†':'Ć','Ä‡':'ć',
    'Ä':'Đ','Ä‘':'đ','Å ':'Š','Å¡':'š',
    'Å½':'Ž','Å¾':'ž'
  };
  return t.replace(new RegExp(Object.keys(map).join('|'),'g'), m => map[m]).toUpperCase();
}

function buildEpcPayload({ name, iban, amount, reference }) {
  return [
    'BCD','001','1','SCT','',
    name || '',
    iban || '',
    amount ? `EUR${amount}` : '',
    '',
    reference || '',
    ''
  ].join('\n');
}

function renderQr(text) {
  const el = document.getElementById('qr');
  el.innerHTML = '';
  new QRCode(el, { text, width:300, height:300 });
}

function copyToClipboard(t) {
  navigator.clipboard.writeText(t);
}

/* ---------- INIT ---------- */
window.onload = () => {
  codeReader = new ZXing.BrowserPDF417Reader();

  codeReader.getVideoInputDevices().then(devices => {
    selectedDeviceId = devices[0]?.deviceId;
  });

  document.getElementById('cameraScanBtn').onclick = startCameraScan;
  document.getElementById('imageScanBtn').onclick = () =>
    document.getElementById('imageInput').click();

  document.getElementById('imageInput').onchange = e => {
    if (e.target.files[0]) scanFromImage(e.target.files[0]);
  };

  document.getElementById('scanAgainButton').onclick = startCameraScan;
  document.getElementById('copyAllButton').onclick = () => {
    copyToClipboard(document.getElementById('result-fields').dataset.visibleData);
  };
};
</script>
</body>
</html>
